# KimiOS installer ISO (0.12.0; docs/SCOPE.md Phase 2): bootc-image-builder --type anaconda-iso.
#
# bootc-image-builder's own installer is unattended and installs to the FIRST DISK IT FINDS. KimiOS's rule is the
# opposite ("never install to the first disk": the reference laptop keeps Windows and a data partition), so this
# kickstart says only `graphical`: Anaconda then asks for the language, the disk and how to divide it (automatic
# or your own, alongside what is there), and the user. Nothing here may choose a disk: no clearpart, autopart,
# zerombr, ignoredisk, or text/cmdline mode (tests/test_iso.py checks).
#
# bootc-image-builder adds the `ostreecontainer` line that installs the image from the ISO itself; %post then
# points the installed system at the registry, so `bootc upgrade` takes new KimiOS images from GitHub.
[customizations.installer.kickstart]
contents = """
graphical

%post --erroronfail
bootc switch --mutate-in-place --transport registry ghcr.io/kiplabat/kimios:latest
%end
"""
