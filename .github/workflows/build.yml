name: Build KimiOS image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # daily: Fedora updates and the newest KimiLM release
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kimios
  FEDORA_VERSION: "45"
  # The newest KimiLM Linux build; a repository variable KIMILM_URL overrides it
  KIMILM_URL: ${{ vars.KIMILM_URL || 'https://github.com/kiplabat/KimiLM/releases/latest/download/KimiLM-linux-x64.tar.gz' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: bash -n build_files/build.sh system_files/usr/libexec/kimios/kimios-session

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: |
          IMAGE_LC="${IMAGE,,}"
          echo "IMAGE_LC=$IMAGE_LC" >> "$GITHUB_ENV"
          podman build \
            --build-arg FEDORA_VERSION="$FEDORA_VERSION" \
            --build-arg KIMILM_URL="$KIMILM_URL" \
            -t "$IMAGE_LC:latest" .

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHORT_SHA="${GITHUB_SHA::7}"
          for tag in latest "$FEDORA_VERSION" "$FEDORA_VERSION-$SHORT_SHA"; do
            podman tag "$IMAGE_LC:latest" "$IMAGE_LC:$tag"
            podman push "$IMAGE_LC:$tag"
          done
