name: Build KimiOS image

# 0.5.0: one image per architecture, each built on a runner of its own kind (x86_64 and ARM64), published together
# under the same tags as one multi-architecture image. A computer pulls the one that fits it.
# 0.15.0: two profiles, each its own image: kimios (desktop, on Silverblue) and kimios-headless (no desktop, on
# fedora-bootc).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # daily: Fedora updates and the newest KimiLM release
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kimios
  FEDORA_VERSION: "45"
  # Where the newest KimiLM Linux builds are (KimiLM-linux-<x64|arm64>.tar.gz); a repository variable overrides it
  KIMILM_BASE: ${{ vars.KIMILM_BASE || 'https://github.com/kiplabat/KimiLM/releases/latest/download' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: for f in build_files/build.sh system_files/usr/libexec/kimios/kimios-session system_files/usr/libexec/kimios/kimios-headless; do bash -n "$f"; done

  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [desktop, headless]
        include:
          - arch: amd64
            kimilm: x64
            runner: ubuntu-24.04
          - arch: arm64
            kimilm: arm64
            runner: ubuntu-24.04-arm
          - profile: desktop
            base: quay.io/fedora/fedora-silverblue
            suffix: ""
          - profile: headless
            base: quay.io/fedora/fedora-bootc
            suffix: "-headless"
    name: image (${{ matrix.profile }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # A dropped connection while downloading the Fedora base (quay.io's CDN: "unexpected EOF") failed a whole
      # build once; podman keeps the layers it already has, so a few tries with a pause usually finish the pull.
      - name: Pull the Fedora base (with retries)
        run: |
          for i in 1 2 3 4 5; do
            podman pull "${{ matrix.base }}:$FEDORA_VERSION" && exit 0
            echo "pull failed (try $i of 5); trying again in $((i * 20)) s"
            sleep $((i * 20))
          done
          exit 1

      - name: Build
        run: |
          IMAGE_LC="${IMAGE,,}${{ matrix.suffix }}"
          echo "IMAGE_LC=$IMAGE_LC" >> "$GITHUB_ENV"
          podman build \
            --build-arg FEDORA_VERSION="$FEDORA_VERSION" \
            --build-arg BASE_IMAGE="${{ matrix.base }}" \
            --build-arg PROFILE="${{ matrix.profile }}" \
            --build-arg KIMILM_URL="$KIMILM_BASE/KimiLM-linux-${{ matrix.kimilm }}.tar.gz" \
            -t "$IMAGE_LC:build" .
          podman run --rm "$IMAGE_LC:build" sh -c 'uname -m; ls -l /usr/bin/kimilm 2>/dev/null || echo "no KimiLM in this image"; /usr/libexec/kimios/kimi-hwprobe | head -c 300; echo'

      # 0.15.0: the headless image is only useful if KimiLM's engine starts on it without a desktop
      - name: Headless - KimiLM's engine answers
        if: matrix.profile == 'headless'
        run: |
          podman run --rm "$IMAGE_LC:build" bash -c '
            set -e
            test -x /usr/bin/kimios-headless
            test -e /etc/systemd/system/multi-user.target.wants/sshd.service
            test -e /etc/systemd/system/multi-user.target.wants/avahi-daemon.service
            test ! -e /usr/share/wayland-sessions/kimios.desktop
            if [ ! -x /usr/lib/kimilm/resources/python/bin/python3 ]; then echo "no KimiLM in this image"; exit 0; fi
            cd /usr/lib/kimilm/resources/engine
            KIMILM_TOKEN=ci KIMILM_SECRETS=file PYTHONNOUSERSITE=1 KIMILM_UI_DIR=/usr/lib/kimilm/resources/ui \
              /usr/lib/kimilm/resources/python/bin/python3 -m kimilm serve --port 8765 --data-dir /tmp/kimilm \
              --resources /usr/lib/kimilm/resources > /tmp/engine.out 2>&1 &
            for i in $(seq 1 120); do grep -q KIMILM_READY /tmp/engine.out && break; sleep 1; done
            grep -q KIMILM_READY /tmp/engine.out || { cat /tmp/engine.out; exit 1; }
            curl -fsS localhost:8765/api/health; echo
            curl -fsS localhost:8765/ | grep -qi "<html" && echo "the interface is served"
            /usr/lib/kimilm/resources/llama/cpu/llama-server --version 2>&1 | tail -1'

      - name: Push this architecture
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHORT_SHA="${GITHUB_SHA::7}"
          for tag in latest "$FEDORA_VERSION" "$FEDORA_VERSION-$SHORT_SHA"; do
            podman tag "$IMAGE_LC:build" "$IMAGE_LC:$tag-${{ matrix.arch }}"
            for i in 1 2 3; do podman push "$IMAGE_LC:$tag-${{ matrix.arch }}" && break; [ "$i" = 3 ] && exit 1; sleep 20; done
          done

  publish:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: One image for both architectures under each tag
        run: |
          IMAGE_LC="${IMAGE,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHORT_SHA="${GITHUB_SHA::7}"
          : > /tmp/digests
          for tag in latest "$FEDORA_VERSION" "$FEDORA_VERSION-$SHORT_SHA"; do
            for image in "$IMAGE_LC" "$IMAGE_LC-headless"; do      # 0.15.0: both profiles
              podman manifest create "$image:$tag"
              for arch in amd64 arm64; do
                podman manifest add "$image:$tag" "docker://$image:$tag-$arch"
              done
              podman manifest push --all --digestfile /tmp/digest "$image:$tag" "docker://$image:$tag"
              echo "$image@$(cat /tmp/digest)" >> /tmp/digests
            done
          done
          sort -u /tmp/digests | tee /tmp/to-sign

      # 0.13.0: sign what was published (the image for both architectures and each architecture's own), so that
      # `bootc upgrade` can refuse an image nobody signed. cosign 2.x: its signatures are the ones bootc and podman
      # read (registries.d/kimios.yaml). No key yet (secret SIGNING_SECRET): published unsigned, with a warning.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Sign the published images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::warning::No SIGNING_SECRET: the images are not signed (docs/SCOPE.md, image signing)"
            exit 0
          fi
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          while read -r ref; do
            for i in 1 2 3; do
              cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$ref" && break
              [ "$i" = 3 ] && exit 1
              sleep 20
            done
          done < /tmp/to-sign
          if [ -f system_files/etc/pki/containers/kimios.pub ]; then
            while read -r ref; do cosign verify --key system_files/etc/pki/containers/kimios.pub "$ref" > /dev/null; done < /tmp/to-sign
            echo "Signed and verified: $(wc -l < /tmp/to-sign) image(s)"
          fi
