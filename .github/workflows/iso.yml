name: Build KimiOS installer ISO

# 0.12.0 (docs/SCOPE.md Phase 2): an interactive installer, x86_64. It asks for the disk (iso/config.toml); it never
# installs to the first disk it finds. Built on request (Actions → Build KimiOS installer ISO → Run workflow) from
# the image already published, and on pull requests that change the installer. The ISO is a workflow artifact
# (about 4 GB, kept 30 days; 7 for pull requests).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to install (latest, 45, 45-<commit>)"
        default: latest
  pull_request:
    paths:
      - iso/**
      - .github/workflows/iso.yml

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kimios
  BUILDER: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h / /mnt

      - name: Pull the image and the builder (root's storage, with retries)
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          REF="${IMAGE,,}:$TAG"
          echo "REF=$REF" >> "$GITHUB_ENV"
          for img in "$REF" "$BUILDER"; do
            for i in 1 2 3 4 5; do
              sudo podman pull --arch amd64 "$img" && break
              [ "$i" = 5 ] && exit 1
              echo "pull of $img failed (try $i of 5); again in $((i * 20)) s"; sleep $((i * 20))
            done
          done

      - name: Build the ISO
        run: |
          sudo mkdir -p /mnt/iso-output
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/iso/config.toml:/config.toml:ro" \
            -v /mnt/iso-output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BUILDER" --type anaconda-iso --rootfs btrfs --config /config.toml "$REF"
          ISO=$(sudo find /mnt/iso-output -name '*.iso' | head -1)
          test -n "$ISO"
          NAME="kimios-installer-x86_64-$(date +%Y%m%d)-${GITHUB_SHA::7}.iso"
          sudo mv "$ISO" "/mnt/$NAME"
          sudo chown "$(id -u)" "/mnt/$NAME"
          (cd /mnt && sha256sum "$NAME" > "$NAME.sha256")
          ls -lh "/mnt/$NAME"
          echo "ISO=/mnt/$NAME" >> "$GITHUB_ENV"

      - name: Check the kickstart inside the ISO asks for the disk
        run: |
          sudo apt-get install -y -qq p7zip-full >/dev/null
          mkdir -p /tmp/ks && 7z x -o/tmp/ks "$ISO" '*.ks' -r >/dev/null || true
          find /tmp/ks -name '*.ks' -exec cat {} + > /tmp/all.ks   # the builder may split it into files
          test -s /tmp/all.ks && cat /tmp/all.ks
          grep -q '^graphical' /tmp/all.ks
          grep -q '^ostreecontainer' /tmp/all.ks
          ! grep -Eq '^(clearpart|autopart|zerombr|ignoredisk|text|cmdline)' /tmp/all.ks

      - uses: actions/upload-artifact@v4
        with:
          name: kimios-installer-x86_64
          path: |
            ${{ env.ISO }}
            ${{ env.ISO }}.sha256
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
